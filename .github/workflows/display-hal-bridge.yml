name: Display HAL Bridge
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Build
        run: |
          set -eu
          NAME=vendor.oplus.hardware.displaypanelfeature-bridge
          mkdir -p src out/odm/bin/hw out/odm/etc/init out/optional/odm/etc/vintf/manifest
          cat > src/hal.c <<'EOF'
          typedef struct AIBinder AIBinder;
          typedef struct AIBinder_Class AIBinder_Class;
          typedef struct AParcel AParcel;
          typedef void *(*create_fn)(void *);
          typedef void (*destroy_fn)(void *);
          typedef int32_t (*transact_fn)(AIBinder *, uint32_t, const AParcel *, AParcel *);

          typedef struct {
              int32_t id;
              int32_t n;
              int32_t seen;
              int32_t v[8];
          } slot_t;

          static AIBinder_Class *(*f_define)(const char *, create_fn, destroy_fn, transact_fn);
          static AIBinder *(*f_new)(AIBinder_Class *, void *);
          static void (*f_vintf)(AIBinder *);
          static int32_t (*f_add)(AIBinder *, const char *);
          static void (*f_start)(void);
          static void (*f_join)(void);
          static void (*f_max)(uint32_t);
          static int32_t (*f_rd)(const AParcel *, int32_t *);
          static int32_t (*f_wr)(AParcel *, int32_t);
          static int32_t (*f_wrstr)(AParcel *, const char *, int32_t);

          static const char *DESC = "vendor.oplus.hardware.displaypanelfeature.IDisplayPanelFeature";
          static const char *INST = "vendor.oplus.hardware.displaypanelfeature.IDisplayPanelFeature/default";
          static const char *doze_path = "/sys/class/mi_display/disp-DSI-0/doze_brightness";
          static const char *bl_dir = "/sys/class/backlight";

          static slot_t slots[32];
          static int nslots;
          static pthread_mutex_t smu = PTHREAD_MUTEX_INITIALIZER;
          static pthread_mutex_t mu = PTHREAD_MUTEX_INITIALIZER;
          static pthread_cond_t cv;
          static int g_target;
          static unsigned g_gen;
          static int g_dummy;

          static void L(int prio, const char *fmt, ...)
          {
              va_list ap;
              va_start(ap, fmt);
              __android_log_vprint(prio, "dpf-bridge", fmt, ap);
              va_end(ap);
          }

          static int rd_int_file(const char *p)
          {
              char b[32];
              int fd, r, i;
              fd = open(p, O_RDONLY | O_CLOEXEC);
              if (fd < 0)
                  return -1;
              r = (int)read(fd, b, sizeof(b) - 1);
              close(fd);
              if (r <= 0)
                  return -1;
              b[r] = 0;
              for (i = 0; i < r; i++)
                  if (b[i] >= '0' && b[i] <= '9')
                      return atoi(b + i);
              return -1;
          }

          static int doze_read(void)
          {
              return rd_int_file(doze_path);
          }

          static int doze_write(int t)
          {
              static int warned;
              char b[8];
              int fd, n, e;
              ssize_t w;
              fd = open(doze_path, O_WRONLY | O_CLOEXEC);
              if (fd < 0) {
                  e = errno;
                  if (!warned) {
                      warned = 1;
                      L(ANDROID_LOG_ERROR, "open %s failed: %d", doze_path, e);
                  }
                  return -e;
              }
              n = snprintf(b, sizeof(b), "%d\n", t);
              w = write(fd, b, (size_t)n);
              e = errno;
              close(fd);
              if (w != n) {
                  if (!warned) {
                      warned = 1;
                      L(ANDROID_LOG_ERROR, "write %s failed: %d", doze_path, e);
                  }
                  return -e;
              }
              return 0;
          }

          static int maxbl_read(void)
          {
              char p[300];
              DIR *d;
              struct dirent *e;
              int m;
              snprintf(p, sizeof(p), "%s/panel0-backlight/max_brightness", bl_dir);
              m = rd_int_file(p);
              if (m > 0)
                  return m;
              d = opendir(bl_dir);
              if (!d)
                  return -1;
              while ((e = readdir(d)) != NULL) {
                  if (e->d_name[0] == '.')
                      continue;
                  snprintf(p, sizeof(p), "%s/%s/max_brightness", bl_dir, e->d_name);
                  m = rd_int_file(p);
                  if (m > 0)
                      break;
              }
              closedir(d);
              return m;
          }

          static slot_t *slot_get(int32_t id, int create)
          {
              int i;
              for (i = 0; i < nslots; i++)
                  if (slots[i].id == id)
                      return &slots[i];
              if (!create || nslots >= 32)
                  return NULL;
              memset(&slots[nslots], 0, sizeof(slot_t));
              slots[nslots].id = id;
              return &slots[nslots++];
          }

          static void note(int32_t id, int op)
          {
              slot_t *s;
              int first = 0;
              pthread_mutex_lock(&smu);
              s = slot_get(id, 1);
              if (s && !(s->seen & op)) {
                  s->seen |= op;
                  first = 1;
              }
              pthread_mutex_unlock(&smu);
              if (first)
                  L(ANDROID_LOG_INFO, "first %s feature %d", op == 1 ? "get" : "set", id);
          }

          static void doze_target(int t)
          {
              if (doze_read() != t)
                  doze_write(t);
              pthread_mutex_lock(&mu);
              g_target = t;
              g_gen++;
              pthread_cond_signal(&cv);
              pthread_mutex_unlock(&mu);
          }

          static void *worker(void *unused)
          {
              static const int delays[4] = {250, 500, 750, 1500};
              unsigned seen = 0;
              int i, t, changed;
              struct timespec ts;
              (void)unused;
              for (;;) {
                  pthread_mutex_lock(&mu);
                  while (g_gen == seen)
                      pthread_cond_wait(&cv, &mu);
                  seen = g_gen;
                  pthread_mutex_unlock(&mu);
                  for (i = 0; i < 4; i++) {
                      clock_gettime(CLOCK_MONOTONIC, &ts);
                      ts.tv_nsec += (long)delays[i] * 1000000L;
                      while (ts.tv_nsec >= 1000000000L) {
                          ts.tv_sec++;
                          ts.tv_nsec -= 1000000000L;
                      }
                      pthread_mutex_lock(&mu);
                      while (g_gen == seen) {
                          if (pthread_cond_timedwait(&cv, &mu, &ts) == ETIMEDOUT)
                              break;
                      }
                      changed = (g_gen != seen);
                      t = g_target;
                      pthread_mutex_unlock(&mu);
                      if (changed)
                          break;
                      if (doze_read() == t)
                          break;
                      doze_write(t);
                  }
              }
              return NULL;
          }

          static int32_t feat_get(int32_t id, int32_t *v, int32_t len)
          {
              int32_t d, m, i;
              slot_t *s;
              note(id, 1);
              if (id == 7) {
                  if (len < 1 || !v)
                      return -EINVAL;
                  d = doze_read();
                  if (d == 1) {
                      v[0] = 0;
                      return 0;
                  }
                  if (d == 2) {
                      v[0] = 1;
                      return 0;
                  }
                  return -ENODATA;
              }
              if (id == 8) {
                  if (len < 1 || !v)
                      return -EINVAL;
                  m = maxbl_read();
                  if (m <= 0)
                      return -EOPNOTSUPP;
                  v[0] = m;
                  return 0;
              }
              pthread_mutex_lock(&smu);
              s = slot_get(id, 0);
              if (s && v)
                  for (i = 0; i < len && i < s->n && i < 8; i++)
                      v[i] = s->v[i];
              pthread_mutex_unlock(&smu);
              return 0;
          }

          static int32_t feat_set(int32_t id, const int32_t *v, int32_t n)
          {
              int32_t i, t;
              slot_t *s;
              note(id, 2);
              pthread_mutex_lock(&smu);
              s = slot_get(id, 1);
              if (s) {
                  s->n = n;
                  for (i = 0; i < n && i < 8; i++)
                      s->v[i] = v[i];
              }
              pthread_mutex_unlock(&smu);
              if (id == 7) {
                  if (n < 1)
                      return -EINVAL;
                  if (v[0] == 0)
                      t = 1;
                  else if (v[0] == 1)
                      t = 2;
                  else
                      return -EINVAL;
                  L(ANDROID_LOG_INFO, "set 7 value %d -> doze_brightness %d", v[0], t);
                  doze_target(t);
              }
              return 0;
          }

          static int32_t on_tx(AIBinder *b, uint32_t code, const AParcel *in, AParcel *out)
          {
              int32_t id = 0, len = 0, tmp = 0, r, i;
              int32_t keep[8];
              int32_t *v;
              (void)b;
              switch (code) {
              case 1:
                  if (f_rd(in, &id) || f_rd(in, &len) || len > 4096)
                      return -EINVAL;
                  v = NULL;
                  if (len >= 0) {
                      v = calloc((size_t)len + 1, sizeof(int32_t));
                      if (!v)
                          return -ENOMEM;
                  }
                  r = feat_get(id, v, len);
                  f_wr(out, 0);
                  f_wr(out, r);
                  if (len < 0) {
                      f_wr(out, -1);
                  } else {
                      f_wr(out, len);
                      for (i = 0; i < len; i++)
                          f_wr(out, v[i]);
                  }
                  free(v);
                  return 0;
              case 2:
                  if (f_rd(in, &id) || f_rd(in, &len) || len > 4096)
                      return -EINVAL;
                  memset(keep, 0, sizeof(keep));
                  for (i = 0; i < len; i++) {
                      if (f_rd(in, &tmp))
                          return -EINVAL;
                      if (i < 8)
                          keep[i] = tmp;
                  }
                  r = feat_set(id, keep, len < 0 ? 0 : (len > 8 ? 8 : len));
                  f_wr(out, 0);
                  f_wr(out, r);
                  return 0;
              case 3:
                  if (f_rd(in, &id))
                      return -EINVAL;
                  f_wr(out, 0);
                  f_wr(out, -EOPNOTSUPP);
                  f_wr(out, 0);
                  return 0;
              case 0xffffff:
                  f_wr(out, 0);
                  f_wr(out, 1);
                  return 0;
              case 0xfffffe:
                  f_wr(out, 0);
                  f_wrstr(out, "notfrozen", 9);
                  return 0;
              }
              return -EBADMSG;
          }

          static void *on_create(void *args)
          {
              (void)args;
              return &g_dummy;
          }

          static void on_destroy(void *data)
          {
              (void)data;
          }

          static void *sym(void *h, const char *n)
          {
              void *p = dlsym(h, n);
              if (!p)
                  L(ANDROID_LOG_ERROR, "missing symbol %s", n);
              return p;
          }

          int main(int argc, char **argv)
          {
              void *h;
              AIBinder_Class *c;
              AIBinder *b;
              pthread_t th;
              pthread_condattr_t ca;
              int i, rc = -1;

              if (argc > 1)
                  doze_path = argv[1];
              if (argc > 2)
                  bl_dir = argv[2];
              pthread_condattr_init(&ca);
              pthread_condattr_setclock(&ca, CLOCK_MONOTONIC);
              pthread_cond_init(&cv, &ca);

              h = dlopen("libbinder_ndk.so", RTLD_NOW);
              if (!h) {
                  L(ANDROID_LOG_ERROR, "dlopen libbinder_ndk.so failed");
                  return 1;
              }
              *(void **)&f_define = sym(h, "AIBinder_Class_define");
              *(void **)&f_new = sym(h, "AIBinder_new");
              *(void **)&f_add = sym(h, "AServiceManager_addService");
              *(void **)&f_start = sym(h, "ABinderProcess_startThreadPool");
              *(void **)&f_join = sym(h, "ABinderProcess_joinThreadPool");
              *(void **)&f_rd = sym(h, "AParcel_readInt32");
              *(void **)&f_wr = sym(h, "AParcel_writeInt32");
              *(void **)&f_wrstr = sym(h, "AParcel_writeString");
              *(void **)&f_vintf = dlsym(h, "AIBinder_markVintfStability");
              *(void **)&f_max = dlsym(h, "ABinderProcess_setThreadPoolMaxThreadCount");
              if (!f_define || !f_new || !f_add || !f_start || !f_join || !f_rd || !f_wr || !f_wrstr)
                  return 1;
              if (!f_vintf)
                  L(ANDROID_LOG_ERROR, "AIBinder_markVintfStability not found");

              c = f_define(DESC, on_create, on_destroy, on_tx);
              if (!c) {
                  L(ANDROID_LOG_ERROR, "class define failed");
                  return 1;
              }
              b = f_new(c, NULL);
              if (!b) {
                  L(ANDROID_LOG_ERROR, "binder new failed");
                  return 1;
              }
              if (f_vintf)
                  f_vintf(b);
              for (i = 0; i < 10; i++) {
                  rc = f_add(b, INST);
                  if (rc == 0)
                      break;
                  L(ANDROID_LOG_ERROR, "addService %s failed: %d (needs VINTF declaration)", INST, rc);
                  sleep(2);
              }
              if (rc != 0)
                  for (;;)
                      pause();
              L(ANDROID_LOG_INFO, "registered %s", INST);
              pthread_create(&th, NULL, worker, NULL);
              if (f_max)
                  f_max(2);
              f_start();
              f_join();
              return 0;
          }
          EOF
          cat > out/odm/etc/init/$NAME.rc <<'EOF'
          service displaypanelfeature_bridge /odm/bin/hw/vendor.oplus.hardware.displaypanelfeature-bridge
              class hal
              user root
              group root system
              seclabel u:r:shell:s0
          EOF
          cat > out/optional/odm/etc/vintf/manifest/$NAME.xml <<'EOF'
          <manifest version="1.0" type="device">
              <hal format="aidl">
                  <name>vendor.oplus.hardware.displaypanelfeature</name>
                  <version>1</version>
                  <fqname>IDisplayPanelFeature/default</fqname>
              </hal>
          </manifest>
          EOF
          printf '%s\n' "odm/bin/hw/$NAME 0 2000 0755 capabilities=0x0" "odm/etc/init/$NAME.rc 0 0 0644 capabilities=0x0" > out/fs_config.txt
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ ! -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            NDK="$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n1)"
          fi
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT="out/odm/bin/hw/$NAME"
          "$BIN/aarch64-linux-android29-clang" -O2 -Wall -fPIE -pie -s \
            -Wl,-z,max-page-size=16384 \
            -include stdint.h -include stdarg.h -include stdlib.h -include string.h \
            -include stdio.h -include unistd.h -include fcntl.h -include errno.h \
            -include time.h -include dirent.h -include pthread.h -include dlfcn.h \
            -include android/log.h \
            src/hal.c -llog -o "$OUT"
          "$BIN/llvm-readelf" -h "$OUT" | grep -q AArch64
          "$BIN/llvm-readelf" -d "$OUT" | grep NEEDED
          if "$BIN/llvm-readelf" -d "$OUT" | grep NEEDED | grep -q 'c++'; then exit 1; fi
          chmod 755 "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: displaypanelfeature-bridge
          path: out
          if-no-files-found: error

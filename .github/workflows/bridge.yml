name: oplus-touch-bridge
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tulis file
        run: |
          mkdir -p src out/odm/bin/hw out/odm/etc/init out/odm/etc/vintf/manifest
          cat > src/touch_bridge.c <<'EOF'
          #define _GNU_SOURCE
          // OPlus IOplusTouch (AIDL V2) -> Xiaomi /proc/tp_gesture bridge (DT2W)
          // Kode transaksi + format parcel diambil dari IOplusTouch$Stub (services.jar).
          #include <android/binder_ibinder.h>
          #include <android/binder_manager.h>
          #include <android/binder_parcel.h>
          #include <android/binder_process.h>
          #include <android/binder_status.h>
          #include <android/log.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          #define TAG "oplus-touch-bridge"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, TAG, __VA_ARGS__)
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, TAG, __VA_ARGS__)

          #define DESCRIPTOR "vendor.oplus.hardware.touch.IOplusTouch"
          #define INSTANCE DESCRIPTOR "/default"
          #define IFACE_VERSION 2
          #define IFACE_HASH "ef41c5fab372bb5ad6a417f606845c87cf0e9b17"

          #ifndef TP_NODE
          #define TP_NODE "/proc/tp_gesture"
          #endif

          // nomor transaksi (dari $Stub)
          #define TX_INITIALIZE 1
          #define TX_IS_NODE_SUPPORT 2
          #define TX_READ_NODE 3
          #define TX_WRITE_NODE 4
          #define TX_WRITE_BT_INFO 5
          #define TX_WRITE_NODE_ONEWAY 6
          #define TX_NOTIFY_CLIENT 7
          #define TX_REGISTER_CB 8
          #define TX_UNREGISTER_CB 9
          #define TX_GET_HASH 0xfffffe
          #define TX_GET_VERSION 0xffffff

          // nodeFlag dari framework
          #define NODE_DOUBLE_TAP 1
          #define NODE_DOUBLE_TAP_INDEP 21

          static pthread_mutex_t g_lock = PTHREAD_MUTEX_INITIALIZER;
          static int g_dt = 0;    // nilai terakhir node 1 (double_tap_enable)
          static int g_indep = 0; // nilai terakhir node 21 (double_tap_enable_indep), bit0 = double tap

          static int write_tp(int on) {
              int fd = open(TP_NODE, O_WRONLY | O_CLOEXEC);
              if (fd < 0) {
                  int e = errno;
                  LOGE("open %s: %s", TP_NODE, strerror(e));
                  return -e;
              }
              const char *v = on ? "1" : "0";
              ssize_t r = write(fd, v, 1);
              int e = errno;
              close(fd);
              if (r != 1) {
                  LOGE("write %s <- %s: %s", TP_NODE, v, strerror(e));
                  return -(e ? e : EIO);
              }
              LOGI("%s <- %s", TP_NODE, v);
              return 0;
          }

          static long parse_long(const char *s) {
              if (!s) return 0;
              while (*s == ' ' || *s == '\t' || *s == '\n') s++;
              return strtol(s, NULL, 10);
          }

          static int handle_write(int node, const char *s) {
              long v = parse_long(s);
              int rc = 0;
              pthread_mutex_lock(&g_lock);
              if (node == NODE_DOUBLE_TAP) {
                  g_dt = v > 0;
              } else if (node == NODE_DOUBLE_TAP_INDEP) {
                  g_indep = (int)v;
              } else {
                  pthread_mutex_unlock(&g_lock);
                  LOGI("write node=%d val='%s' diabaikan", node, s ? s : "");
                  return 0;
              }
              LOGI("write node=%d val=%ld", node, v);
              rc = write_tp(g_dt || (g_indep & 1));
              pthread_mutex_unlock(&g_lock);
              return rc;
          }

          static void handle_read(int node, char *out, size_t n) {
              out[0] = '0';
              out[1] = 0;
              if (node == NODE_DOUBLE_TAP) {
                  int fd = open(TP_NODE, O_RDONLY | O_CLOEXEC);
                  if (fd >= 0) {
                      char b[16];
                      ssize_t r = read(fd, b, sizeof(b) - 1);
                      close(fd);
                      if (r > 0) {
                          b[r] = 0;
                          char *p = b;
                          while (*p == ' ') p++;
                          size_t l = strcspn(p, " \r\n");
                          if (l > 0 && l < n) {
                              memcpy(out, p, l);
                              out[l] = 0;
                          }
                      }
                  }
              } else if (node == NODE_DOUBLE_TAP_INDEP) {
                  pthread_mutex_lock(&g_lock);
                  snprintf(out, n, "%x", g_indep);
                  pthread_mutex_unlock(&g_lock);
              }
          }

          typedef struct {
              char *buf;
              bool is_null;
          } StrBuf;

          static bool str_alloc(void *data, int32_t length, char **buffer) {
              StrBuf *s = (StrBuf *)data;
              if (length == 0) return false;
              if (length < 0) {
                  s->is_null = true;
                  return true;
              }
              s->buf = (char *)calloc((size_t)length, 1);
              if (!s->buf) return false;
              *buffer = s->buf;
              return true;
          }

          static binder_status_t read_2i(const AParcel *in, int32_t *a, int32_t *b) {
              binder_status_t s = AParcel_readInt32(in, a);
              if (s != STATUS_OK) return s;
              return AParcel_readInt32(in, b);
          }

          static binder_status_t read_2i_str(const AParcel *in, int32_t *a, int32_t *b, StrBuf *sb) {
              binder_status_t s = read_2i(in, a, b);
              if (s != STATUS_OK) return s;
              sb->buf = NULL;
              sb->is_null = false;
              return AParcel_readString(in, sb, str_alloc);
          }

          static binder_status_t write_ok(AParcel *out) {
              AStatus *st = AStatus_newOk();
              binder_status_t s = AParcel_writeStatusHeader(out, st);
              AStatus_delete(st);
              return s;
          }

          static binder_status_t reply_int(AParcel *out, int32_t v) {
              binder_status_t s = write_ok(out);
              if (s != STATUS_OK) return s;
              return AParcel_writeInt32(out, v);
          }

          static void *on_create(void *args) { return args; }
          static void on_destroy(void *user) { (void)user; }

          static binder_status_t on_transact(AIBinder *binder, transaction_code_t code,
                                             const AParcel *in, AParcel *out) {
              (void)binder;
              int32_t a = 0, b = 0;
              StrBuf sb = {NULL, false};
              binder_status_t s;

              switch (code) {
              case TX_INITIALIZE:
                  LOGI("initialize()");
                  return reply_int(out, 0);

              case TX_IS_NODE_SUPPORT: {
                  s = read_2i(in, &a, &b);
                  if (s != STATUS_OK) return s;
                  int sup = (a == NODE_DOUBLE_TAP || a == NODE_DOUBLE_TAP_INDEP) ? 1 : 0;
                  LOGI("isTouchNodeSupport(%d,%d) -> %d", a, b, sup);
                  return reply_int(out, sup);
              }

              case TX_READ_NODE: {
                  s = read_2i(in, &a, &b);
                  if (s != STATUS_OK) return s;
                  char tmp[32];
                  handle_read(a, tmp, sizeof(tmp));
                  LOGD("touchReadNodeFile(%d,%d) -> '%s'", a, b, tmp);
                  s = write_ok(out);
                  if (s != STATUS_OK) return s;
                  return AParcel_writeString(out, tmp, (int32_t)strlen(tmp));
              }

              case TX_WRITE_NODE: {
                  s = read_2i_str(in, &a, &b, &sb);
                  if (s != STATUS_OK) {
                      free(sb.buf);
                      return s;
                  }
                  int rc = handle_write(a, sb.is_null ? NULL : sb.buf);
                  free(sb.buf);
                  return reply_int(out, rc);
              }

              case TX_WRITE_NODE_ONEWAY: {
                  s = read_2i_str(in, &a, &b, &sb);
                  if (s == STATUS_OK) handle_write(a, sb.is_null ? NULL : sb.buf);
                  free(sb.buf);
                  return STATUS_OK; // oneway: tanpa reply
              }

              case TX_WRITE_BT_INFO:
              case TX_NOTIFY_CLIENT:
              case TX_REGISTER_CB:
              case TX_UNREGISTER_CB:
                  LOGD("tx %u diabaikan", (unsigned)code);
                  return reply_int(out, 0);

              case TX_GET_VERSION:
                  return reply_int(out, IFACE_VERSION);

              case TX_GET_HASH:
                  s = write_ok(out);
                  if (s != STATUS_OK) return s;
                  return AParcel_writeString(out, IFACE_HASH, (int32_t)strlen(IFACE_HASH));

              default:
                  LOGE("tx tidak dikenal: %u", (unsigned)code);
                  return STATUS_UNKNOWN_TRANSACTION;
              }
          }

          int main(void) {
              ABinderProcess_setThreadPoolMaxThreadCount(2);
              AIBinder_Class *cls = AIBinder_Class_define(DESCRIPTOR, on_create, on_destroy, on_transact);
              if (!cls) {
                  LOGE("AIBinder_Class_define gagal");
                  return 1;
              }
              AIBinder *bn = AIBinder_new(cls, NULL);
              if (!bn) {
                  LOGE("AIBinder_new gagal");
                  return 1;
              }
              AIBinder_markVintfStability(bn);
              binder_exception_t ex = AServiceManager_addService(bn, INSTANCE);
              if (ex != EX_NONE) {
                  LOGE("addService %s gagal: %d (cek vintf + service_contexts + avc)", INSTANCE, (int)ex);
                  return 1;
              }
              LOGI("terdaftar: %s", INSTANCE);
              ABinderProcess_startThreadPool();
              ABinderProcess_joinThreadPool();
              return 1;
          }
          EOF
          cat > out/odm/etc/init/vendor.oplus.hardware.touch-bridge.rc <<'EOF'
          service vendor.oplus.touch-bridge /odm/bin/hw/vendor.oplus.hardware.touch-bridge-service
              interface aidl vendor.oplus.hardware.touch.IOplusTouch/default
              class hal
              user root
              group system
          EOF
          cat > out/odm/etc/vintf/manifest/manifest_touch_bridge.xml <<'EOF'
          <manifest version="1.0" type="device">
              <hal format="aidl">
                  <name>vendor.oplus.hardware.touch</name>
                  <version>2</version>
                  <fqname>IOplusTouch/default</fqname>
              </hal>
          </manifest>
          EOF
          cat > out/README.txt <<'EOF'
          OPLUS TOUCH BRIDGE (DT2W) - IOplusTouch V2 -> /proc/tp_gesture

          ISI (salin ke odm, folder sama):
            odm/bin/hw/vendor.oplus.hardware.touch-bridge-service   (izin 0755, owner 0, group 2000)
            odm/etc/init/vendor.oplus.hardware.touch-bridge.rc      (0644)
            odm/etc/vintf/manifest/manifest_touch_bridge.xml        (0644)

          SEBELUM REPACK:
            1. Cari teks "oplus.hardware.touch" di semua etc/vintf (odm, vendor, system_ext, product, system).
               Kalau sudah ada deklarasi IOplusTouch, JANGAN pakai xml-nya (dobel deklarasi = boot gagal).
            2. file_contexts odm: salin baris bin HAL charger-V6, ganti nama bin jadi
               /odm/bin/hw/vendor\.oplus\.hardware\.touch-bridge-service  (tipe label sama).
            3. service_contexts (odm/vendor): salin baris vendor.oplus.hardware.charger.ICharger/default,
               ganti nama jadi vendor.oplus.hardware.touch.IOplusTouch/default  (tipe sama).

          TES SETELAH BOOT (satu baris):
            su -c 'service list | grep -i oplus.hardware.touch; logcat -d -s oplus-touch-bridge; cat /proc/tp_gesture'
          Lalu toggle Double tap to wake di Settings on/off, ulang baris tes: isi tp_gesture harus ikut 1/0.
          Kalau log bilang "Permission denied" / ada avc tp_gesture: itu SELinux, jalankan generator avc.
          EOF

      - name: Build (NDK, arm64, API 30)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n1)
          fi
          echo "NDK=$NDK"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          OUT=out/odm/bin/hw/vendor.oplus.hardware.touch-bridge-service
          "$BIN/aarch64-linux-android30-clang" -std=gnu11 -O2 -Wall -Wextra -fPIE -pie \
            -Wl,-z,max-page-size=16384 -o "$OUT" src/touch_bridge.c -lbinder_ndk -llog
          "$BIN/llvm-strip" "$OUT"
          chmod 755 "$OUT"
          ls -l "$OUT"

      - name: Cek hasil
        run: |
          set -e
          OUT=out/odm/bin/hw/vendor.oplus.hardware.touch-bridge-service
          "$BIN/llvm-readelf" -d "$OUT" | grep NEEDED
          "$BIN/llvm-readelf" -d "$OUT" | grep -q libbinder_ndk
          if "$BIN/llvm-readelf" -d "$OUT" | grep -q 'libc++_shared'; then echo "ERROR: butuh libc++_shared"; exit 1; fi
          python3 -c "import xml.dom.minidom as m; m.parse('out/odm/etc/vintf/manifest/manifest_touch_bridge.xml'); print('vintf xml OK')"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: touch-bridge
          path: out/
